<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Auth layout harness</title>
  </head>
  <body>
    <!-- The Solid AuthLayout rendering each docs example, for tests/auth-layout.spec.ts. Not part of the site build. -->
    <beautiful-example id="app"></beautiful-example>
    <script>
      // ?theme=classic&mode=dark, as the docs site's switches set them. ?example=sign-in renders that one
      // example alone, so the page has the one <main> a real page has.
      const query = new URLSearchParams(location.search);
      document.documentElement.dataset.theme = query.get("theme") ?? "glass";
      document.documentElement.dataset.mode = query.get("mode") ?? "light";
    </script>
    <script type="module" src="./auth-layout.tsx"></script>
  </body>
</html>

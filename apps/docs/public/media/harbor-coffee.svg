<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200">
  <defs>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="27"/></filter>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".75"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".4"/>
    </linearGradient>
  </defs>
  <rect width="300" height="200" fill="#f4eee6"/>
  <g filter="url(#soft)">
    <circle cx="60" cy="50" r="96" fill="#dcc7b0"/>
    <circle cx="255" cy="40" r="84" fill="#c7dbe9"/>
    <circle cx="180" cy="190" r="102" fill="#ece1d2"/>
  </g>
  <g transform="translate(150 100)">
    <rect x="-90" y="-48" width="180" height="96" rx="9" fill="url(#pane)" stroke="#fff" stroke-opacity=".9" stroke-width="1"/>
    <rect x="-72" y="-24" width="78" height="9" rx="4" fill="#000" fill-opacity=".22"/>
    <rect x="-72" y="-6" width="108" height="5" rx="2" fill="#000" fill-opacity=".12"/>
    <rect x="-72" y="16" width="36" height="12" rx="6" fill="#000" fill-opacity=".18"/>
  </g>
</svg>

# The kit is the root package (beautiful-ui-solid). The docs site is in apps/, the editor
# in packages/.
packages:
  - "."
  - "apps/*"
  - "packages/*"

# One version of the shared toolchain. A package names these as "catalog:".
catalogMode: strict
catalog:
  "@axe-core/playwright": 4.14.0
  # The browser tests.
  "@playwright/test": 1.63.0
  vite: 8.3.4
  wrangler: 4.150.0

# Solid's compiler must not be newer than its runtime (solid-js, @solidjs/web): a newer
# compiler's dev output can import a function the runtime lacks, so `vite` dev fails while
# builds pass. @solidjs/vite-plugin asks for ^2.0.0, which floats, so the compiler is pinned to
# the newest release not newer than the runtime. Move it with the runtime.
overrides:
  "@solidjs/compiler": 2.0.2
  # The editor needs one copy of each: a step or a schema from a second copy fails
  # ProseMirror's instanceof checks. Move these together.
  prosemirror-model: 1.25.12
  prosemirror-state: 1.4.4
  prosemirror-transform: 1.12.2
  prosemirror-view: 1.42.6
